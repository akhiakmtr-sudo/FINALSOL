
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopncarT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    #root:empty { display: none; }
    #error-display { 
      display: none; padding: 20px; background: #fff1f2; color: #be123c; 
      border: 2px solid #fb7185; margin: 20px; border-radius: 12px; font-family: monospace;
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react/": "https://esm.sh/react@19.0.0/",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/": "https://esm.sh/react-dom@19.0.0/",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "@google/genai": "https://esm.sh/@google/genai@1.34.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.45.0",
    "recharts": "https://esm.sh/recharts@2.15.0"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="error-display"></div>
  <div id="root"></div>

  <!-- Diagnostic Script -->
  <script>
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      var display = document.getElementById('error-display');
      display.style.display = 'block';
      display.innerHTML = '<h4>Application Error:</h4>' +
        '<p>' + msg + '</p>' +
        '<small>' + url + ' L:' + lineNo + ' C:' + columnNo + '</small>';
      return false;
    };
  </script>

  <!-- Entry Point -->
  <script type="module" src="./index.tsx"></script>
</body>
</html>
